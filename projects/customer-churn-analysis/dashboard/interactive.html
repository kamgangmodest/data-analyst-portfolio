<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Customer Churn Interactive Demo</title><style>
  body{font-family:Inter,Arial,sans-serif;background:#0d1025;color:#fff;margin:0;padding:28px}.wrap{max-width:1120px;margin:auto}.top{display:flex;justify-content:space-between;gap:20px;align-items:end;flex-wrap:wrap}h1{margin:.2rem 0;font-size:34px}p{color:#b8b3c8}.controls{display:flex;gap:12px;flex-wrap:wrap}.controls select{padding:10px 12px;background:#211638;color:#fff;border:1px solid #6d245f;border-radius:7px}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:24px 0}.card{background:#211638;border:1px solid #5b2b60;border-radius:12px;padding:19px}.card span{display:block;color:#bdb1cb;font-size:12px}.big{font-size:27px;font-weight:800;margin-top:5px}.panel{background:#211638;border:1px solid #5b2b60;border-radius:12px;padding:18px;margin-top:18px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid #3b2947}th{color:#cbb8d7;font-size:12px}.back{color:#65bfff;text-decoration:none;font-weight:700}@media(max-width:760px){.kpis{grid-template-columns:1fr 1fr}}@media(max-width:480px){.kpis{grid-template-columns:1fr}}
  </style></head><body><div class="wrap"><a class="back" href="../../../index.html">← Portfolio</a><div class="top"><div><h1>Customer Churn Interactive Demo</h1><p>Filter by contract type to see how churn and revenue exposure change across customer segments.</p></div><div class="controls"><label>Contract <select id="filter"><option>All</option></select></label></div></div><div class="kpis"><div class="card"><span id="l1"></span><div class="big" id="k1"></div></div><div class="card"><span id="l2"></span><div class="big" id="k2"></div></div><div class="card"><span id="l3"></span><div class="big" id="k3"></div></div><div class="card"><span id="l4"></span><div class="big" id="k4"></div></div></div><div class="panel"><h2>Filtered Detail</h2><table><thead><tr><th>Payment Method</th><th>Customers</th><th>Churn Rate</th><th>Monthly Revenue</th></tr></thead><tbody id="tbl"></tbody></table></div></div><script>
async function main(){
 const txt=await fetch('../data/customer_churn.csv').then(r=>r.text());const lines=txt.trim().split(/\r?\n/),h=lines[0].split(',');
 const d=lines.slice(1).map(l=>{let v=l.split(','),o={};h.forEach((x,i)=>o[x]=v[i]);o.monthly_charges=+o.monthly_charges;return o});
 const vals=[...new Set(d.map(x=>x.contract_type))].sort(),s=document.getElementById('filter');vals.forEach(x=>s.insertAdjacentHTML('beforeend','<option>'+x+'</option>'));
 const fm=n=>'$'+Math.round(n).toLocaleString();
 function render(){let f=s.value==='All'?d:d.filter(x=>x.contract_type===s.value),ch=f.filter(x=>x.churn==='Yes'),rev=f.reduce((a,x)=>a+x.monthly_charges,0),risk=ch.reduce((a,x)=>a+x.monthly_charges,0);
 document.getElementById('l1').textContent='CUSTOMERS';document.getElementById('k1').textContent=f.length;
 document.getElementById('l2').textContent='CHURN RATE';document.getElementById('k2').textContent=(100*ch.length/(f.length||1)).toFixed(1)+'%';
 document.getElementById('l3').textContent='MONTHLY REVENUE';document.getElementById('k3').textContent=fm(rev);
 document.getElementById('l4').textContent='REVENUE AT RISK';document.getElementById('k4').textContent=fm(risk);
 let p={};f.forEach(x=>{p[x.payment_method]??={n:0,ch:0,rev:0};p[x.payment_method].n++;p[x.payment_method].rev+=x.monthly_charges;if(x.churn==='Yes')p[x.payment_method].ch++});
 document.getElementById('tbl').innerHTML=Object.entries(p).sort((a,b)=>(b[1].ch/b[1].n)-(a[1].ch/a[1].n)).map(([k,v])=>'<tr><td>'+k+'</td><td>'+v.n+'</td><td>'+(100*v.ch/v.n).toFixed(1)+'%</td><td>'+fm(v.rev)+'</td></tr>').join('')}
 s.onchange=render;render()
}main();</script></body></html>
