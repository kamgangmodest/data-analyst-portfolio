<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RevOps Interactive Demo</title><style>body{font-family:Arial;background:#0d1025;color:white;margin:0;padding:30px}.wrap{max-width:1100px;margin:auto}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.card{background:#221638;border:1px solid #66305f;border-radius:12px;padding:20px}.big{font-size:28px;font-weight:700}.controls{margin:20px 0}.controls select{padding:10px;background:#17152e;color:white;border:1px solid #6d245f;border-radius:6px}table{width:100%;border-collapse:collapse;background:#17152e}th,td{padding:10px;border-bottom:1px solid #34243f;text-align:left}@media(max-width:700px){.kpis{grid-template-columns:1fr 1fr}}</style></head><body><div class="wrap"><h1>Interactive RevOps Demo</h1><p>Browser-based portfolio demo. Use the segment filter to update the KPIs.</p><div class="controls"><label>Segment: <select id="seg"><option>All</option><option>SMB</option><option>Mid-Market</option><option>Enterprise</option></select></label></div><div class="kpis"><div class="card"><div>Closed-Won ARR</div><div class="big" id="arr"></div></div><div class="card"><div>Open Pipeline</div><div class="big" id="pipe"></div></div><div class="card"><div>Win Rate</div><div class="big" id="win"></div></div><div class="card"><div>Avg Deal</div><div class="big" id="avg"></div></div></div><h2>Performance by Source</h2><table><thead><tr><th>Source</th><th>Deals</th><th>Wins</th><th>Won ARR</th></tr></thead><tbody id="tbl"></tbody></table></div><script>async function go(){const t=await fetch('../data/revops_deals.csv').then(r=>r.text());const lines=t.trim().split(/\n/);const h=lines[0].split(',');const data=lines.slice(1).map(l=>{const v=l.split(',');let o={};h.forEach((x,i)=>o[x]=v[i]);o.arr_value=+o.arr_value;return o});function render(){let s=document.getElementById('seg').value;let d=s==='All'?data:data.filter(x=>x.segment===s);let w=d.filter(x=>x.stage==='Closed Won'), l=d.filter(x=>x.stage==='Closed Lost'), op=d.filter(x=>x.stage==='Open');let arr=w.reduce((a,x)=>a+x.arr_value,0),pipe=op.reduce((a,x)=>a+x.arr_value,0),wr=w.length/(w.length+l.length||1),avg=arr/(w.length||1);const fm=n=>'$'+Math.round(n).toLocaleString();arrEl=document.getElementById('arr');arrEl.textContent=fm(arr);document.getElementById('pipe').textContent=fm(pipe);document.getElementById('win').textContent=(wr*100).toFixed(1)+'%';document.getElementById('avg').textContent=fm(avg);let src={};d.forEach(x=>{src[x.source]??={deals:0,wins:0,arr:0};src[x.source].deals++;if(x.stage==='Closed Won'){src[x.source].wins++;src[x.source].arr+=x.arr_value}});document.getElementById('tbl').innerHTML=Object.entries(src).sort((a,b)=>b[1].arr-a[1].arr).map(([k,v])=>'<tr><td>'+k+'</td><td>'+v.deals+'</td><td>'+v.wins+'</td><td>'+fm(v.arr)+'</td></tr>').join('')}document.getElementById('seg').onchange=render;render()}go();</script></body></html>
