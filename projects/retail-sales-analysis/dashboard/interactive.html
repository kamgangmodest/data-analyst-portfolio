<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Retail Sales Interactive Demo</title><style>
  body{font-family:Inter,Arial,sans-serif;background:#0d1025;color:#fff;margin:0;padding:28px}.wrap{max-width:1120px;margin:auto}.top{display:flex;justify-content:space-between;gap:20px;align-items:end;flex-wrap:wrap}h1{margin:.2rem 0;font-size:34px}p{color:#b8b3c8}.controls{display:flex;gap:12px;flex-wrap:wrap}.controls select{padding:10px 12px;background:#211638;color:#fff;border:1px solid #6d245f;border-radius:7px}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:24px 0}.card{background:#211638;border:1px solid #5b2b60;border-radius:12px;padding:19px}.card span{display:block;color:#bdb1cb;font-size:12px}.big{font-size:27px;font-weight:800;margin-top:5px}.panel{background:#211638;border:1px solid #5b2b60;border-radius:12px;padding:18px;margin-top:18px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid #3b2947}th{color:#cbb8d7;font-size:12px}.back{color:#65bfff;text-decoration:none;font-weight:700}@media(max-width:760px){.kpis{grid-template-columns:1fr 1fr}}@media(max-width:480px){.kpis{grid-template-columns:1fr}}
  </style></head><body><div class="wrap"><a class="back" href="../../../index.html">← Portfolio</a><div class="top"><div><h1>Retail Sales Interactive Demo</h1><p>Filter the synthetic portfolio dataset by category and recalculate the KPIs in your browser.</p></div><div class="controls"><label>Category <select id="filter"><option>All</option></select></label></div></div><div class="kpis"><div class="card"><span id="l1"></span><div class="big" id="k1"></div></div><div class="card"><span id="l2"></span><div class="big" id="k2"></div></div><div class="card"><span id="l3"></span><div class="big" id="k3"></div></div><div class="card"><span id="l4"></span><div class="big" id="k4"></div></div></div><div class="panel"><h2>Filtered Detail</h2><table><thead><tr><th>Product</th><th>Revenue</th><th>Profit</th><th>Units</th></tr></thead><tbody id="tbl"></tbody></table></div></div><script>
async function main(){
 const txt=await fetch('../data/retail_sales.csv').then(r=>r.text());
 const lines=txt.trim().split(/\r?\n/),h=lines[0].split(',');
 const d=lines.slice(1).map(l=>{let v=l.split(','),o={};h.forEach((x,i)=>o[x]=v[i]);['quantity','unit_price','unit_cost','discount_pct'].forEach(k=>o[k]=+o[k]);return o});
 const cats=[...new Set(d.map(x=>x.category))].sort();const s=document.getElementById('filter');cats.forEach(x=>s.insertAdjacentHTML('beforeend','<option>'+x+'</option>'));
 const fm=n=>'$'+Math.round(n).toLocaleString();
 function render(){let f=s.value==='All'?d:d.filter(x=>x.category===s.value);let rev=0,prof=0,units=0,p={};f.forEach(x=>{let r=x.quantity*x.unit_price*(1-x.discount_pct),g=r-x.quantity*x.unit_cost;rev+=r;prof+=g;units+=x.quantity;p[x.product_name]??={rev:0,prof:0,units:0};p[x.product_name].rev+=r;p[x.product_name].prof+=g;p[x.product_name].units+=x.quantity});
 document.getElementById('l1').textContent='REVENUE';document.getElementById('k1').textContent=fm(rev);
 document.getElementById('l2').textContent='GROSS PROFIT';document.getElementById('k2').textContent=fm(prof);
 document.getElementById('l3').textContent='GROSS MARGIN';document.getElementById('k3').textContent=(100*prof/rev).toFixed(1)+'%';
 document.getElementById('l4').textContent='UNITS SOLD';document.getElementById('k4').textContent=units.toLocaleString();
 document.getElementById('tbl').innerHTML=Object.entries(p).sort((a,b)=>b[1].rev-a[1].rev).slice(0,10).map(([k,v])=>'<tr><td>'+k+'</td><td>'+fm(v.rev)+'</td><td>'+fm(v.prof)+'</td><td>'+v.units+'</td></tr>').join('')}
 s.onchange=render;render()
}main();</script></body></html>
