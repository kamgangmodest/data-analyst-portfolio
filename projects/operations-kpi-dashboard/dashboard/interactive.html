<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Operations KPI Interactive Demo</title><style>
  body{font-family:Inter,Arial,sans-serif;background:#0d1025;color:#fff;margin:0;padding:28px}.wrap{max-width:1120px;margin:auto}.top{display:flex;justify-content:space-between;gap:20px;align-items:end;flex-wrap:wrap}h1{margin:.2rem 0;font-size:34px}p{color:#b8b3c8}.controls{display:flex;gap:12px;flex-wrap:wrap}.controls select{padding:10px 12px;background:#211638;color:#fff;border:1px solid #6d245f;border-radius:7px}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:24px 0}.card{background:#211638;border:1px solid #5b2b60;border-radius:12px;padding:19px}.card span{display:block;color:#bdb1cb;font-size:12px}.big{font-size:27px;font-weight:800;margin-top:5px}.panel{background:#211638;border:1px solid #5b2b60;border-radius:12px;padding:18px;margin-top:18px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid #3b2947}th{color:#cbb8d7;font-size:12px}.back{color:#65bfff;text-decoration:none;font-weight:700}@media(max-width:760px){.kpis{grid-template-columns:1fr 1fr}}@media(max-width:480px){.kpis{grid-template-columns:1fr}}
  </style></head><body><div class="wrap"><a class="back" href="../../../index.html">← Portfolio</a><div class="top"><div><h1>Operations KPI Interactive Demo</h1><p>Filter by operational team to review workload, backlog, SLA, and quality performance.</p></div><div class="controls"><label>Team <select id="filter"><option>All</option></select></label></div></div><div class="kpis"><div class="card"><span id="l1"></span><div class="big" id="k1"></div></div><div class="card"><span id="l2"></span><div class="big" id="k2"></div></div><div class="card"><span id="l3"></span><div class="big" id="k3"></div></div><div class="card"><span id="l4"></span><div class="big" id="k4"></div></div></div><div class="panel"><h2>Filtered Detail</h2><table><thead><tr><th>Priority</th><th>Received</th><th>Completed</th><th>On-Time</th><th>Reopen</th></tr></thead><tbody id="tbl"></tbody></table></div></div><script>
async function main(){
 const txt=await fetch('../data/operational_tickets.csv').then(r=>r.text());const lines=txt.trim().split(/\r?\n/),h=lines[0].split(',');
 const d=lines.slice(1).map(l=>{let v=l.split(','),o={};h.forEach((x,i)=>o[x]=v[i]);o.reopened_flag=+o.reopened_flag;return o});
 const teams=[...new Set(d.map(x=>x.team))].sort(),s=document.getElementById('filter');teams.forEach(x=>s.insertAdjacentHTML('beforeend','<option>'+x+'</option>'));
 function render(){let f=s.value==='All'?d:d.filter(x=>x.team===s.value),c=f.filter(x=>x.status==='Completed'),op=f.filter(x=>x.status!=='Completed'),ot=c.filter(x=>x.completed_at<=x.due_at),rr=c.filter(x=>x.reopened_flag).length/(c.length||1);
 document.getElementById('l1').textContent='RECEIVED';document.getElementById('k1').textContent=f.length;
 document.getElementById('l2').textContent='COMPLETED';document.getElementById('k2').textContent=c.length;
 document.getElementById('l3').textContent='OPEN BACKLOG';document.getElementById('k3').textContent=op.length;
 document.getElementById('l4').textContent='ON-TIME %';document.getElementById('k4').textContent=(100*ot.length/(c.length||1)).toFixed(1)+'%';
 let p={};f.forEach(x=>{p[x.priority]??={n:0,c:0,ot:0,r:0};p[x.priority].n++;if(x.status==='Completed'){p[x.priority].c++;if(x.completed_at<=x.due_at)p[x.priority].ot++;if(x.reopened_flag)p[x.priority].r++}});
 document.getElementById('tbl').innerHTML=Object.entries(p).map(([k,v])=>'<tr><td>'+k+'</td><td>'+v.n+'</td><td>'+v.c+'</td><td>'+(100*v.ot/(v.c||1)).toFixed(1)+'%</td><td>'+(100*v.r/(v.c||1)).toFixed(1)+'%</td></tr>').join('')}
 s.onchange=render;render()
}main();</script></body></html>
